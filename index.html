<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Betty Lou's Farm Hop</title>
<meta name="description" content="Help Betty Lou and friends hop across farm roads, pastures and creeks before the sun sets, then grow the Fish Pond back home with the sunflowers you pick.">
<meta name="theme-color" content="#2f6e3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farm Hop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fredoka for Latin text; Noto Sans SC fills in Chinese (Google only sends the characters a page uses) -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="left">
    <div id="scoreCard" class="pill">
      <div id="score">0</div>
      <div id="top">Best 0</div>
    </div>
    <div id="sky" role="img" data-i18n-aria="aria.daylight" aria-label="Daylight left"><span id="sunDot"></span></div>
  </div>
  <div id="coins" class="pill"><svg class="flower" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#3a2442" stroke-width="1.4" stroke-linejoin="round"><path d="M12 1.5l2.6 4.2 4.8-1.2-1.2 4.8 4.3 2.7-4.3 2.7 1.2 4.8-4.8-1.2L12 22.5l-2.6-4.2-4.8 1.2 1.2-4.8L1.5 12l4.3-2.7-1.2-4.8 4.8 1.2z" fill="#ffcc1a"/><circle cx="12" cy="12" r="4.4" fill="#7a4a1c"/></g></svg><span id="coinN">0</span></div>
</div>

<div id="title">
  <div class="logo">
    <div class="l1">Betty Lou's</div>
    <div class="l2"><span>F</span><span>A</span><span>R</span><span>M</span></div>
    <div class="l2 l3"><span>H</span><span>O</span><span>P</span><span>!</span></div>
  </div>
</div>

<div id="hint" class="pill">Tap to hop<small>Swipe to turn &amp; go back</small></div>

<div id="farmBtns" class="btnRow">
  <button class="heroBtn bubble" data-i18n-aria="aria.chooseHopper" aria-label="Choose hopper"><img class="cutout" alt=""></button>
  <button id="bunkBtn" class="bunkBtn bubble" data-i18n-aria="aria.bunkhouse" aria-label="Bunkhouse">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v8.5H5z" fill="#c98a4b" stroke="#3a2442" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 13.8h14M5 16.6h14" stroke="#8a5a2c" stroke-width="1.2"/><path d="M2.8 11.6 12 4.2l9.2 7.4" fill="#5fb84a" stroke="#3a2442" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M10.2 19.5v-4.3h3.6v4.3" fill="#7a4a1c" stroke="#3a2442" stroke-width="1.3" stroke-linejoin="round"/></svg>
  </button>
  <button id="start" class="playBtn bubble" data-i18n-aria="aria.startDay" aria-label="Start the day">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5.2c0-1 1.1-1.6 1.9-1.1l10 6.5c.8.5.8 1.7 0 2.2l-10 6.5c-.8.5-1.9-.1-1.9-1.1z" fill="#fff" stroke="#3a2442" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
  <button id="pondBtn" class="pondBtn bubble" data-i18n-aria="aria.fishPond" aria-label="Fish Pond">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12c2.6-4 8.4-5.4 12.6-1.6L20.5 7v10l-4.4-3.4C11.9 17.4 6.1 16 3.5 12z" fill="#ff9a3c" stroke="#3a2442" stroke-width="1.5" stroke-linejoin="round"/><circle cx="8" cy="11.2" r="1.1" fill="#3a2442"/></svg>
  </button>
</div>

<div id="over">
  <div class="sign">
    <div id="overMsg"></div>
    <div id="overGain"></div>
    <div id="newTop" data-i18n="newBest">New best!</div>
  </div>
  <div class="btnRow">
    <button id="play" class="playBtn bubble" data-i18n-aria="aria.backFarm" aria-label="Back to the farm">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.5l8 6.7v8a1.3 1.3 0 0 1-1.3 1.3h-4.2v-5.2h-5v5.2H5.3A1.3 1.3 0 0 1 4 19.2z" fill="#fff" stroke="#3a2442" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<div id="heroes" class="sheet" role="dialog" aria-modal="true" aria-labelledby="heroesTitle">
  <div class="panel">
    <h2 id="heroesTitle" data-i18n="pickHopper">Pick your hopper</h2>
    <div id="heroGrid"></div>
    <button id="heroClose" class="closeBtn bubble" data-i18n-aria="aria.close" aria-label="Close">&#x2715;</button>
  </div>
</div>

<div id="pond" class="sheet" role="dialog" aria-modal="true" aria-labelledby="pondTitle">
  <div class="panel pondPanel">
    <h2 id="pondTitle" data-i18n="fishPond">Fish Pond</h2>
    <div id="pondLevel" class="pondLevel">Level 0</div>
    <div class="pondNextRow"><span class="label" data-i18n="next">Next</span><span id="pondNext">Fish move in</span></div>
    <button id="pondBuy" class="buyBtn bubble">
      <span data-i18n="upgrade">Upgrade</span>
      <span class="price"><svg class="flower" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#3a2442" stroke-width="1.4" stroke-linejoin="round"><path d="M12 1.5l2.6 4.2 4.8-1.2-1.2 4.8 4.3 2.7-4.3 2.7 1.2 4.8-4.8-1.2L12 22.5l-2.6-4.2-4.8 1.2 1.2-4.8L1.5 12l4.3-2.7-1.2-4.8 4.8 1.2z" fill="#ffcc1a"/><circle cx="12" cy="12" r="4.4" fill="#7a4a1c"/></g></svg><span id="pondCost">1</span></span>
    </button>
    <p id="pondNeed" class="pondNeed"></p>
    <button id="pondClose" class="closeBtn bubble" data-i18n-aria="aria.close" aria-label="Close">&#x2715;</button>
  </div>
</div>

<div id="bunk" class="sheet" role="dialog" aria-modal="true" aria-labelledby="bunkTitle">
  <div class="panel bunkPanel">
    <h2 id="bunkTitle" data-i18n="bunkhouse">Bunkhouse</h2>
    <div id="bunkPlan" class="bunkPlan">
      <p data-i18n="bunkPlan">Build a cozy cabin so new hoppers can move in.</p>
      <button id="bunkBuy" class="buyBtn bubble">
        <span data-i18n="build">Build</span>
        <span class="price"><svg class="flower" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#3a2442" stroke-width="1.4" stroke-linejoin="round"><path d="M12 1.5l2.6 4.2 4.8-1.2-1.2 4.8 4.3 2.7-4.3 2.7 1.2 4.8-4.8-1.2L12 22.5l-2.6-4.2-4.8 1.2 1.2-4.8L1.5 12l4.3-2.7-1.2-4.8 4.8 1.2z" fill="#ffcc1a"/><circle cx="12" cy="12" r="4.4" fill="#7a4a1c"/></g></svg><span id="bunkCost">10</span></span>
      </button>
    </div>
    <div id="bunkHome">
      <p class="bunkWho" data-i18n="bunkWho">Tap a hopper to invite them to the farm.</p>
      <div id="bunkGrid"></div>
    </div>
    <p id="bunkNeed" class="pondNeed"></p>
    <button id="bunkClose" class="closeBtn bubble" data-i18n-aria="aria.close" aria-label="Close">&#x2715;</button>
  </div>
</div>

<div id="settings" class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="panel setPanel">
    <h2 id="setTitle" data-i18n="settings">Settings</h2>
    <div class="setRow" data-row="lang">
      <div class="setLabel" id="langLabel" data-i18n="language">Language</div>
      <div class="seg" id="segLang" role="radiogroup" aria-labelledby="langLabel"></div>
    </div>
    <div class="setRow" data-row="music">
      <label class="setLabel" for="volMusic" data-i18n="music">Music</label>
      <input id="volMusic" class="vol" type="range" min="0" max="100" step="5">
    </div>
    <div class="setRow" data-row="fx">
      <label class="setLabel" for="volFx" data-i18n="effects">Effects</label>
      <input id="volFx" class="vol" type="range" min="0" max="100" step="5">
    </div>
    <div class="setRow" data-row="view">
      <div class="setLabel" id="viewLabel" data-i18n="view">View</div>
      <div class="seg segView" id="segView" role="radiogroup" aria-labelledby="viewLabel"></div>
      <p class="setNote" id="viewNote"></p>
    </div>
    <div class="setRow" data-row="art">
      <div class="setLabel" id="artLabel" data-i18n="art">Art style</div>
      <div class="seg" id="segArt" role="radiogroup" aria-labelledby="artLabel"></div>
    </div>
    <div class="setRow" data-row="gfx">
      <div class="setLabel" id="gfxLabel" data-i18n="graphics">Graphics</div>
      <div class="seg" id="segGfx" role="radiogroup" aria-labelledby="gfxLabel"></div>
      <p class="setNote" id="gfxNote"></p>
    </div>
    <button id="setClose" class="closeBtn bubble" data-i18n-aria="aria.close" aria-label="Close">&#x2715;</button>
  </div>
</div>

<div id="wipe" aria-hidden="true"><div class="dawn"></div><div class="sun"></div><div class="hills"></div></div>

<button id="gear" class="bubble" data-i18n-aria="aria.settings" aria-label="Settings">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2.5h3.4l.5 2.6 1.6.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.6 2.6.5v3.4l-2.6.5-.7 1.6 1.5 2.2-2.4 2.4-2.2-1.5-1.6.7-.5 2.6h-3.4l-.5-2.6-1.6-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.6-2.6-.5v-3.4l2.6-.5.7-1.6-1.5-2.2 2.4-2.4 2.2 1.5 1.6-.7z" fill="#fff" stroke="#3a2442" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="#bd96ff" stroke="#3a2442" stroke-width="1.5"/></svg>
</button>
<button id="sound" class="bubble" data-i18n-aria="aria.sound" aria-label="Sound on or off">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff" stroke="#3a2442" stroke-width="1.5" stroke-linejoin="round"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#3a2442" stroke-width="1.6" stroke-linecap="round"/><path class="x" d="M16 9l5 6M21 9l-5 6" stroke="#3a2442" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="game.js"></script>
</body>
</html>
