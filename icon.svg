<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <clipPath id="hair"><circle cx="32" cy="33" r="15.6"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#a8dcff"/>
    <path d="M0 46 Q16 38 32 44 T64 42 V64 H0Z" fill="#7ccf4f"/>
    <path d="M0 55 Q20 50 40 55 T64 54 V64 H0Z" fill="#6bbd42"/>
    <g fill="#fff4e0" stroke="#3a2442" stroke-width="1">
      <rect x="4" y="49" width="3" height="10" rx="1.5"/><rect x="57" y="49" width="3" height="10" rx="1.5"/>
      <rect x="2" y="52" width="60" height="2.2" rx="1"/>
    </g>
  </g>
  <g stroke="#3a2442" stroke-width="1.4">
    <!-- high rainbow pigtails -->
    <circle cx="12.5" cy="15" r="4.2" fill="#ff6b6b"/><circle cx="9" cy="20.5" r="3.9" fill="#ffa24a"/><circle cx="8" cy="26.5" r="3.6" fill="#ffd84a"/><circle cx="9.5" cy="32" r="3.2" fill="#6bd864"/>
    <circle cx="51.5" cy="15" r="4.2" fill="#ff6b6b"/><circle cx="55" cy="20.5" r="3.9" fill="#ffa24a"/><circle cx="56" cy="26.5" r="3.6" fill="#ffd84a"/><circle cx="54.5" cy="32" r="3.2" fill="#6bd864"/>
    <circle cx="16" cy="18" r="2.6" fill="#ff5fa2"/><circle cx="48" cy="18" r="2.6" fill="#ff5fa2"/>
    <!-- overalls peeking in at the bottom -->
    <path d="M20 64 V56 Q32 50 44 56 V64Z" fill="#3e6fd8"/>
    <!-- head -->
    <circle cx="32" cy="35" r="15.5" fill="#ffd3b4"/>
  </g>
  <!-- rainbow hair: stripes side to side, a cap over the top of the head -->
  <g clip-path="url(#hair)">
    <path d="M14 33 Q32 14 50 33 V10 H14Z" fill="none"/>
    <g>
      <rect x="15" y="15" width="6" height="18" fill="#ff6b6b"/><rect x="21" y="13" width="5.7" height="17" fill="#ffa24a"/><rect x="26.7" y="12" width="5.6" height="15" fill="#ffd84a"/>
      <rect x="32.3" y="12" width="5.6" height="15" fill="#6bd864"/><rect x="37.9" y="13" width="5.7" height="17" fill="#5bb4ff"/><rect x="43.6" y="15" width="6" height="18" fill="#bd96ff"/>
    </g>
  </g>
  <path d="M16.6 32.5 Q32 16 47.4 32.5" fill="none" stroke="#3a2442" stroke-width="1.2" opacity=".35"/>
  <circle cx="32" cy="33" r="15.6" fill="none" stroke="#3a2442" stroke-width="1.4"/>
  <!-- face -->
  <ellipse cx="26" cy="37" rx="1.9" ry="2.6" fill="#3a2442"/><ellipse cx="38" cy="37" rx="1.9" ry="2.6" fill="#3a2442"/>
  <circle cx="26.6" cy="36" r=".7" fill="#fff"/><circle cx="38.6" cy="36" r=".7" fill="#fff"/>
  <ellipse cx="21.5" cy="41.5" rx="2.6" ry="1.4" fill="#ff9eb5"/><ellipse cx="42.5" cy="41.5" rx="2.6" ry="1.4" fill="#ff9eb5"/>
  <path d="M29 42.5 Q32 45.5 35 42.5" fill="none" stroke="#c2475f" stroke-width="1.4" stroke-linecap="round"/>
